<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Cola de cierres (el componente)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div style="width:1440px;height:900px;display:flex;background:#F7F7F5;font-family:Archivo,system-ui,sans-serif;color:#111111;font-variant-numeric:tabular-nums">
  <div aria-hidden="true" style="width:240px;background:#1C1C1A;flex-shrink:0"></div>
  <main style="flex:1;min-width:0;display:flex;flex-direction:column">
    <div aria-hidden="true" style="height:64px;border-bottom:1px solid #e7e5e4;background:#ffffff;flex-shrink:0"></div>
    <div style="padding:24px 32px;display:flex;flex-direction:column;gap:16px;flex:1;min-height:0">

      <header style="display:flex;justify-content:space-between;align-items:flex-end;gap:16px">
        <div style="display:flex;flex-direction:column;gap:4px">
          <h1 style="margin:0;font-size:24px;font-weight:700">Cierres del día</h1>
          <p style="margin:0;font-size:14px;color:#44403c">{{descripcion}}</p>
        </div>
        <sc-if value="{{hayToggle}}" hint-placeholder-val="{{ true }}">
          <div role="group" aria-label="Tipo de cierre" style="display:flex;padding:4px;border-radius:10px;background:#ffffff;border:1px solid #e7e5e4">
            <button type="button" aria-pressed="{{esBodega}}" style="{{tglBodega}}">Bodega</button>
            <button type="button" aria-pressed="{{esMensajero}}" style="{{tglMens}}">Mensajero</button>
          </div>
        </sc-if>
      </header>

      <div role="tablist" aria-label="{{tabsAria}}" style="display:flex;gap:24px;border-bottom:1px solid #e7e5e4">
        <sc-for list="{{tabs}}" as="t" hint-placeholder-count="2">
          <button type="button" role="tab" onClick="{{t.pick}}" style="{{t.style}}">{{t.label}}</button>
        </sc-for>
      </div>

      <!-- Barra EXISTENTE de DataTable: BuscadorFiltros (componente compartido) + DescargarDatasetButton. No se rediseña: se reutiliza tal cual, h-8. -->
      <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
        <div style="position:relative;width:300px;height:32px">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#78716c" stroke-width="2" stroke-linecap="round" aria-hidden="true" style="position:absolute;left:10px;top:8px"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
          <input type="search" aria-label="Buscar" placeholder="{{buscarPh}}" style="font:inherit;font-size:14px;width:100%;height:32px;box-sizing:border-box;padding:0 10px 0 32px;border:1px solid #e7e5e4;border-radius:8px;background:#ffffff">
        </div>
        <sc-for list="{{filtros}}" as="fi" hint-placeholder-count="2">
          <button type="button" style="font:inherit;font-size:14px;height:32px;padding:0 10px;border-radius:8px;border:1px solid #e7e5e4;background:#ffffff;cursor:pointer;display:flex;align-items:center;gap:6px"><span style="color:#44403c">{{fi.label}}:</span> {{fi.valor}} <span aria-hidden="true" style="color:#78716c">▾</span></button>
        </sc-for>
        <button type="button" style="font:inherit;font-size:14px;height:32px;padding:0 10px;border-radius:8px;border:1px solid #e7e5e4;background:#ffffff;cursor:pointer;display:flex;align-items:center;gap:6px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"></path><circle cx="16" cy="6" r="2"></circle><circle cx="10" cy="12" r="2"></circle><circle cx="18" cy="18" r="2"></circle></svg>{{filtrosLabel}} <span aria-hidden="true" style="color:#78716c">▾</span></button>
        <button type="button" style="font:inherit;font-size:14px;height:32px;padding:0 8px;border:0;background:transparent;color:#44403c;cursor:pointer">Limpiar todo</button>
        <span style="flex:1"></span>
        <button type="button" style="font:inherit;font-size:14px;font-weight:500;height:32px;padding:0 12px;border-radius:8px;border:1px solid #e7e5e4;background:#ffffff;cursor:pointer;display:flex;align-items:center;gap:6px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"></path></svg>Descargar <span aria-hidden="true" style="color:#78716c">▾</span></button>
      </div>

      <sc-if value="{{aviso}}" hint-placeholder-val="{{ false }}">
        <div role="status" style="display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:10px;background:#fef3c7;color:#92400e;font-size:14px">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 9v4M12 17h.01"></path><path d="M10.3 3.9L1.8 18a2 2 0 001.7 3h17a2 2 0 001.7-3L13.7 3.9a2 2 0 00-3.4 0z"></path></svg>
          <span>{{avisoTexto}}</span>
        </div>
      </sc-if>

      <sc-if value="{{hayKpis}}" hint-placeholder-val="{{ false }}">
        <div style="{{kpiGrid}}">
          <sc-for list="{{kpis}}" as="k" hint-placeholder-count="4">
            <div style="{{k.caja}}">
              <span style="font-size:13px;color:#44403c">{{k.label}}</span>
              <span style="{{k.valorStyle}}">{{k.valor}}</span>
              <span style="font-size:12px;color:#44403c">{{k.sub}}</span>
            </div>
          </sc-for>
        </div>
      </sc-if>

      <section aria-label="{{tablaAria}}" style="background:#ffffff;border:1px solid #e7e5e4;border-radius:12px;padding:4px 16px;flex:1;min-height:0;overflow:auto">
        <div style="{{cabStyle}}">
          <sc-for list="{{cols}}" as="c" hint-placeholder-count="8"><span style="{{c.style}}">{{c.label}}</span></sc-for>
        </div>
        <sc-for list="{{filas}}" as="f" hint-placeholder-count="4">
          <div style="{{filaStyle}}">
            <sc-for list="{{f.celdas}}" as="ce" hint-placeholder-count="8"><span style="{{ce.style}}">{{ce.v}}</span></sc-for>
            <span style="display:flex;gap:6px;justify-content:flex-end">
              <sc-for list="{{f.acciones}}" as="a" hint-placeholder-count="1"><button type="button" style="{{a.style}}">{{a.label}}</button></sc-for>
            </span>
          </div>
        </sc-for>
      </section>

      <footer style="display:flex;justify-content:space-between;align-items:center;gap:12px;padding-top:12px;border-top:1px solid #e7e5e4">
        <span style="font-size:13px;color:#44403c">{{pie}}</span>
        <sc-if value="{{hayBotonPie}}" hint-placeholder-val="{{ false }}">
          <button type="button" style="{{botonPieStyle}}">Solicitar cierre de bodega</button>
        </sc-if>
      </footer>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"tipo":{"editor":"enum","options":["mensajero","bodega"],"default":"mensajero"},"rol":{"editor":"enum","options":["central","satelite","mensajero"],"default":"central"},"tabInicial":{"editor":"enum","options":["1","2"],"default":"1"},"estado":{"editor":"enum","options":["normal","bloqueado","central debe"],"default":"normal"},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { tab: null }; }
  renderVals() {
    const tipo = this.props.tipo ?? 'mensajero';
    const rol = this.props.rol ?? 'central';
    const estado = this.props.estado ?? 'normal';
    const esBodega = tipo === 'bodega', sat = rol === 'satelite';
    const tab = this.state.tab ?? (this.props.tabInicial ?? '1');
    const t1 = tab === '1';

    const pill = (bg, fg) => 'font-size:12px;font-weight:500;padding:2px 10px;border-radius:999px;background:' + bg + ';color:' + fg;
    const P = { sol: pill('#fef3c7', '#92400e'), ok: pill('#d1fae5', '#047857'), rd: pill('#fee2e2', '#b91c1c'), inc: pill('#fff7ed', '#9a3412'), gr: pill('#f5f5f4', '#44403c') };
    const bPri = 'font:inherit;font-size:13px;font-weight:500;height:32px;padding:0 12px;border-radius:8px;border:0;background:#111111;color:#ffffff;cursor:pointer';
    const bSec = 'font:inherit;font-size:13px;font-weight:500;height:32px;padding:0 12px;border-radius:8px;border:1px solid #e7e5e4;background:#ffffff;color:#111111;cursor:pointer';
    const tgl = (on) => 'font:inherit;font-size:14px;font-weight:' + (on ? '600' : '400') + ';height:36px;padding:0 16px;border-radius:8px;border:0;cursor:pointer;background:' + (on ? '#111111' : 'transparent') + ';color:' + (on ? '#ffffff' : '#44403c');
    const tabSt = (on) => 'font:inherit;font-size:14px;font-weight:' + (on ? '600' : '500') + ';color:' + (on ? '#111111' : '#44403c') + ';background:transparent;border:0;border-bottom:2px solid ' + (on ? '#111111' : 'transparent') + ';padding:10px 2px;cursor:pointer';
    const L = 'color:#111111', R = 'text-align:right', Rb = 'text-align:right;font-weight:600', M = "font-family:'JetBrains Mono',monospace;font-size:13px", G = 'color:#44403c', S = 'padding-left:16px;font-size:12px;color:#92400e', F = 'text-align:right;color:#92400e;font-weight:600';
    const kpi = (label, valor, sub, kind) => ({ label, valor, sub,
      caja: 'border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:6px;' + (kind === 'hl' ? 'background:#FFF8D9;border:1px solid #FFD000' : kind === 'warn' ? 'background:#ffffff;border:1px solid #f59e0b' : 'background:#ffffff;border:1px solid #e7e5e4'),
      valorStyle: 'font-size:22px;font-weight:700' + (kind === 'warn' ? ';color:#92400e' : kind === 'ok' ? ';color:#047857' : '') });
    const cell = (v, style) => ({ v, style: style || L });

    let tabs, cols, filas, kpis = [], descripcion, pie = '', aviso = false, avisoTexto = '', hayBotonPie = false, filtros, tablaAria, tabsAria, buscarPh;
    const set = (a, b) => [{ label: a, pick: () => this.setState({ tab: '1' }), style: tabSt(t1) }, { label: b, pick: () => this.setState({ tab: '2' }), style: tabSt(!t1) }];

    if (rol === 'mensajero') {
      // ===== el propio mensajero: sus cierres solicitados (/cierre-dia) =====
      descripcion = 'Tus cierres enviados a aprobación y cómo terminaron.';
      tabsAria = 'Tus cierres'; tablaAria = 'Cierres solicitados'; buscarPh = 'Folio';
      filtros = [{ label: 'Fecha de solicitud', valor: 'Cualquier fecha' }, { label: 'Estado', valor: 'Todos' }];
      tabs = [{ label: 'Cierres solicitados 14', pick: () => {}, style: tabSt(true) }];
      kpis = [kpi('Ganancia pendiente de pago', '₡47.500,00', '1 cierre aprobado sin liquidar', 'hl'), kpi('Ganancia pagada este mes', '₡412.300,00', '9 cierres liquidados')];
      cols = [{ label: 'Folio' }, { label: 'Solicitado' }, { label: 'Destino' }, { label: 'Estado' }, { label: 'Recaudado', style: R }, { label: 'Ganancia', style: R }, { label: 'Pago', style: 'padding-left:16px' }, { label: '' }];
      const f = (fo, fe, de, est, p, rec, ga, pa) => ({ celdas: [cell(fo, M), cell(fe, G), cell(de, G), { v: est, style: p }, cell(rec, R), cell(ga, R), cell(pa, 'padding-left:16px;font-size:13px')], acciones: [{ label: 'Ver', style: bSec }] });
      filas = [f('#8F2A11C4', '07/11 18:42', 'Bodega central', 'Solicitado', P.sol, '₡285.275,00', '₡45.000,55', '—'),
               f('#5E11A0B3', '06/11 19:30', 'Bodega central', 'Aprobado', P.ok, '₡301.120,00', '₡47.500,00', 'Pendiente de pago'),
               f('#B40C7D21', '05/11 19:44', 'Bodega central', 'Rechazado', P.rd, '₡120.000,00', '₡22.000,00', 'Motivo: «Faltan 2 paquetes»'),
               f('#9A0C5512', '04/11 19:12', 'Bodega central', 'Aprobado', P.ok, '₡110.000,00', '₡20.000,00', 'Liquidado')];
      pie = 'Mostrando 4 de 14 · 10 por página';
    } else if (!esBodega) {
      // ===== cola de cierres de MENSAJEROS: igual para central y satélite =====
      descripcion = sat ? 'Bodega satélite · Limón. Revisa el cierre de cada mensajero de tu bodega y apruébalo o recházalo.'
                        : 'Bodega central · GAM. Revisa el cierre de cada mensajero y apruébalo o recházalo.';
      tabsAria = 'Cierres del día por estado'; tablaAria = t1 ? 'Pendientes de decisión' : 'Cierres resueltos';
      buscarPh = 'Mensajero o folio';
      filtros = [{ label: 'Fecha de solicitud', valor: 'Cualquier fecha' }, { label: 'Mensajero', valor: 'Todos' }, { label: 'Estado', valor: 'Todos' }];
      tabs = set('Pendientes 3', 'Resueltos 12');
      const base = [{ label: 'Folio' }, { label: 'Mensajero' }, { label: t1 ? 'Solicitado' : 'Resuelto' }, { label: 'Estado' }, { label: 'Recaudado', style: R }, { label: 'Pago al mensajero', style: R }];
      // La central además ve si el pago al mensajero ya se le entregó (solo en Resueltos).
      const conPago = !sat && !t1;
      cols = base.concat(conPago ? [{ label: 'Pago entregado', style: 'padding-left:16px' }] : []).concat([{ label: 'Señales', style: 'padding-left:16px' }, { label: '' }]);
      const fila = (folio, mens, fecha, est, estP, rec, pago, entregado, senal, acciones) => ({
        celdas: [cell(folio, M), cell(mens), cell(fecha, G), { v: est, style: estP }, cell(rec, R), cell(pago, R)]
          .concat(conPago ? [cell(entregado, 'padding-left:16px')] : []).concat([cell(senal, S)]), acciones });
      const n = sat ? ['Ana Mensajera', 'Beto Mensajero', 'Carla Mensajera'] : ['Diego Mensajero', 'Elena Mensajera', 'Fabio Mensajero'];
      filas = t1 ? [
        fila('#8F2A11C4', n[0], '07/11 18:42', 'Solicitado', P.sol, '₡285.275,00', '₡45.000,55', '', '1 incidente sin indemnizar · 6 vuelven a bodega', [{ label: 'Ver / decidir', style: bPri }]),
        fila('#2C91B0AA', n[1], '07/11 18:55', 'Solicitado', P.sol, '₡146.089,07', '₡25.000,25', '', '1 pago ajustado', [{ label: 'Ver / decidir', style: bPri }]),
        fila('#71D0E3F2', n[2], '06/11 19:10', 'Vencido', P.rd, '₡98.400,00', '₡18.000,00', '', 'Mensajero bloqueado · 1', [{ label: 'Ver', style: bSec }, { label: 'Destrabar', style: bSec }])
      ] : [
        fila('#5E11A0B3', n[0], '06/11 19:30', 'Aprobado', P.ok, '₡301.120,00', '₡47.500,00', 'Pendiente ₡47.500,00', '', sat ? [{ label: 'Ver', style: bSec }] : [{ label: 'Ver', style: bSec }, { label: 'Registrar pago', style: bPri }]),
        fila('#9A0C5512', n[2], '06/11 19:12', 'Aprobado', P.ok, '₡110.000,00', '₡20.000,00', 'Liquidado', '', [{ label: 'Ver', style: bSec }]),
        fila('#B40C7D21', n[1], '06/11 19:44', 'Rechazado', P.rd, '₡120.000,00', '₡22.000,00', '—', 'Bloqueante hasta re-solicitud', [{ label: 'Ver', style: bSec }])
      ];
      pie = t1 ? 'Un cierre vencido se puede destrabar como excepción.' : 'Mostrando 3 de 12 · 10 por página';
    } else if (sat) {
      // ===== bodega · satélite: A consolidar / Solicitados =====
      descripcion = 'Bodega satélite · Limón. Junta los cierres aprobados de tus mensajeros y envíalos a la central.';
      tabsAria = 'Cierre de bodega por etapa'; buscarPh = 'Folio';
      filtros = [{ label: 'Fecha de solicitud', valor: 'Cualquier fecha' }];
      tabs = set('A consolidar 3', 'Solicitados 8');
      if (t1) {
        tablaAria = 'Cierres del día a consolidar';
        aviso = estado === 'bloqueado'; avisoTexto = 'Todavía no puedes consolidar: Beto Mensajero tiene un cierre sin resolver. Apruébalo o recházalo primero.';
        kpis = [kpi('Recaudado', '₡529.764,07', 'Efectivo ₡389.764,07 · SINPE ₡140.000,00'), kpi('Pago a mensajeros', '₡88.000,80', '3 mensajeros · se paga del efectivo'),
                kpi('Gana la bodega satélite', '₡3.600,00', 'por devoluciones y no entregadas'), kpi('Debe llegar a la central', '₡438.163,27', 'recaudado − mensajeros − bodega', 'hl')];
        if (estado === 'central debe') kpis.push(kpi('La central debe', '₡12.500,00', 'el efectivo no alcanzó para pagar a todos los mensajeros', 'warn'));
        cols = [{ label: 'Folio' }, { label: 'Mensajero' }, { label: 'Aprobado' }, { label: 'Recaudado', style: R }, { label: 'Pago', style: R }, { label: 'Gana bodega', style: R }, { label: 'A la central', style: R }, { label: 'Señales', style: 'padding-left:16px' }, { label: '' }];
        const f = (fo, me, ap, rec, pa, bo, ce, se) => ({ celdas: [cell(fo, M), cell(me), cell(ap, G), cell(rec, R), cell(pa, R), cell(bo, R), cell(ce, Rb), cell(se, S)], acciones: [{ label: 'Ver su cierre', style: bSec }] });
        filas = [f('#5E11A0B3', 'Ana Mensajera', '07/11 19:10', '₡285.275,00', '₡45.000,55', '₡1.200,00', '₡239.074,45', '1 pago ajustado'),
                 f('#2C91B0AA', 'Beto Mensajero', '07/11 19:22', '₡146.089,07', '₡25.000,25', '₡2.400,00', '₡118.688,82', ''),
                 f('#71D0E3F2', 'Carla Mensajera', '07/11 19:40', '₡98.400,00', '₡18.000,00', '₡0,00', '₡80.400,00', '')];
        hayBotonPie = true;
        pie = estado === 'bloqueado' ? 'Se habilita cuando no quede ningún cierre de mensajero por resolver.' : 'Se enviarán los 3 cierres aprobados a la central. No se puede deshacer.';
      } else {
        tablaAria = 'Cierres de bodega solicitados';
        kpis = [kpi('Por llegar a la central', '₡438.163,27', '1 cierre pendiente de conciliar', 'hl'), kpi('Recibido por la central (30 días)', '₡2.871.400,10', '7 cierres de bodega'), kpi('Falta por recibir', '₡15.000,00', '1 llegó incompleto', 'warn')];
        cols = [{ label: 'Folio' }, { label: 'Solicitado' }, { label: 'Cierres', style: R }, { label: 'Recaudado', style: R }, { label: 'Debe llegar', style: R }, { label: 'Recibido', style: R }, { label: 'Falta', style: R }, { label: 'Estado', style: 'padding-left:16px' }, { label: '' }];
        const f = (fo, fe, n, rec, de, re, fa, est, p) => ({ celdas: [cell(fo, M), cell(fe, G), cell(n, R), cell(rec, R), cell(de, Rb), cell(re, R), cell(fa, fa === '₡0,00' ? R + ';color:#44403c' : F), { v: est, style: 'padding-left:16px;' + p }], acciones: [{ label: 'Ver', style: bSec }] });
        filas = [f('#C07B3E19', '07/11 19:55', '3', '₡529.764,07', '₡438.163,27', '—', '₡438.163,27', 'Pendiente de conciliar', P.sol),
                 f('#A1F20B77', '06/11 20:02', '2', '₡412.300,00', '₡349.100,00', '₡334.100,00', '₡15.000,00', 'Recibido incompleto', P.inc),
                 f('#7B0D11C2', '05/11 19:48', '3', '₡501.880,50', '₡414.980,50', '₡414.980,50', '₡0,00', 'Recibido', P.ok)];
        pie = '«Ver» abre el cierre de bodega con su dinero, sus gestiones, sus mensajeros y lo que marcó la central.';
      }
    } else {
      // ===== bodega · central: Por conciliar / Conciliados =====
      descripcion = 'Los cierres que mandan las bodegas satélite. Márcalos recibidos cuando llegue el dinero.';
      tabsAria = 'Cierres de bodega por estado'; buscarPh = 'Folio o bodega';
      filtros = [{ label: 'Fecha de solicitud', valor: 'Cualquier fecha' }, { label: 'Bodega', valor: 'Todas' }];
      tabs = set('Por conciliar 3', 'Conciliados 21');
      tablaAria = t1 ? 'Cierres de bodega por conciliar' : 'Cierres de bodega conciliados';
      cols = [{ label: 'Folio' }, { label: 'Bodega' }, { label: 'Solicitó' }, { label: 'Solicitado' }, { label: 'Cierres', style: R }, { label: 'Debe llegar', style: R }, { label: 'Recibido', style: R }, { label: 'Falta', style: R }, { label: 'Estado', style: 'padding-left:16px' }, { label: '' }];
      const f = (fo, bo, qu, fe, n, de, re, fa, est, p, acc) => ({ celdas: [cell(fo, M), cell(bo), cell(qu, G), cell(fe, G), cell(n, R), cell(de, Rb), cell(re, R), cell(fa, fa === '₡0,00' ? R + ';color:#44403c' : F), { v: est, style: 'padding-left:16px;' + p }], acciones: acc });
      filas = t1 ? [
        f('#C07B3E19', 'Limón', 'Sara Satélite', '07/11 19:55', '3', '₡438.163,27', '—', '₡438.163,27', 'Pendiente de conciliar', P.sol, [{ label: 'Ver / conciliar', style: bPri }]),
        f('#D2201F0B', 'Turrialba', 'Oscar Satélite', '07/11 18:20', '1', '₡0,00', '—', '₡0,00', 'Pendiente de conciliar', P.sol, [{ label: 'Ver / conciliar', style: bPri }]),
        f('#A1F20B77', 'Limón', 'Sara Satélite', '06/11 20:02', '2', '₡349.100,00', '₡334.100,00', '₡15.000,00', 'Recibido incompleto', P.inc, [{ label: 'Ver / corregir', style: bPri }])
      ] : [
        f('#7B0D11C2', 'Limón', 'Sara Satélite', '05/11 19:48', '3', '₡414.980,50', '₡414.980,50', '₡0,00', 'Recibido', P.ok, [{ label: 'Ver', style: bSec }]),
        f('#33E9A0D4', 'Limón', 'Sara Satélite', '04/11 19:30', '2', '₡338.800,00', '₡338.800,00', '₡0,00', 'Recibido', P.ok, [{ label: 'Ver', style: bSec }])
      ];
      pie = t1 ? 'Un cierre «Recibido incompleto» se queda aquí hasta que la diferencia se reciba o se corrija.' : 'Mostrando 2 de 21 · 10 por página';
    }

    // La barra es la de FiltrosCierresBarra (BuscadorFiltros): el placeholder y los filtros
    // disponibles son los de hoy (Fecha de solicitud, Bodega, Mensajero, Estado según el rol).
    // Aquí se pinta un filtro ya puesto para que se vea cómo queda.
    buscarPh = 'Usa los filtros para acotar los cierres';
    filtros = rol === 'mensajero' ? [] : [{ label: 'Fecha de solicitud', valor: 'Últimos 7 días' }];
    const filtrosLabel = filtros.length ? 'Filtros (' + filtros.length + ')' : 'Filtros';
    const n = cols.length;
    const plantilla = (n >= 10 ? '110px 1fr 1fr 110px 70px 1fr 1fr 1fr 170px' : n === 9 && !esBodega ? '110px 1.3fr 120px 120px 1fr 1fr 1.2fr 1.5fr' : n === 9 ? '110px 1.2fr 120px 1fr 1fr 1fr 1fr 1.3fr' : '110px 1.4fr 120px 120px 1fr 1fr 1.6fr') + ' 200px';
    const plantillaB = rol === 'mensajero' ? '110px 120px 1fr 120px 1fr 1fr 1.6fr 200px' : esBodega && sat && !t1 ? '110px 110px 70px 1fr 1fr 1fr 1fr 170px 200px' : plantilla;
    return {
      hayToggle: rol !== 'mensajero', filtrosLabel,
      esBodega, esMensajero: !esBodega, tglBodega: tgl(esBodega), tglMens: tgl(!esBodega),
      descripcion, filtros, buscarPh, tabs, tabsAria, tablaAria, aviso, avisoTexto,
      hayKpis: kpis.length > 0, kpis, kpiGrid: 'display:grid;gap:12px;grid-template-columns:repeat(' + kpis.length + ',minmax(0,1fr))',
      cols: cols.map((c) => ({ label: c.label, style: c.style || '' })),
      cabStyle: 'display:grid;grid-template-columns:' + plantillaB + ';gap:8px;font-size:12px;color:#44403c;padding:10px 0;border-bottom:1px solid #e7e5e4',
      filaStyle: 'display:grid;grid-template-columns:' + plantillaB + ';gap:8px;font-size:14px;padding:12px 0;border-bottom:1px solid #f5f5f4;align-items:center',
      filas, pie, hayBotonPie,
      botonPieStyle: 'font:inherit;font-size:14px;font-weight:500;height:40px;padding:0 18px;border-radius:8px;border:0;cursor:' + (estado === 'bloqueado' ? 'not-allowed' : 'pointer') + ';background:' + (estado === 'bloqueado' ? '#d6d3d1' : '#111111') + ';color:' + (estado === 'bloqueado' ? '#44403c' : '#ffffff')
    };
  }
}
