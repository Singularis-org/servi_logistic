# Gate de CI del arnes (diseno v2, seccion 6).
#
#   PR hacia `dev`            -> gate-completo + e2e          (los dos, informativos: ver abajo)
#   PR hacia `prod`           -> gate-completo + e2e          (los dos, informativos)
#   workflow_dispatch         -> los dos, a mano, sobre la rama elegida
#
# `gate-completo` es el check que manda, pero ya no corre la suite el solo: la reparten los jobs
# `estatico` y `vitest` (3 shards) y el une los informes y da el veredicto (ver `jobs:`).
#
# Postgres es un contenedor de servicio, efimero: nace y muere con el job. La version es la
# de la plantilla del arnes, 17 (ABIERTO: confirmar la de Supabase de servi_logistic), no la que
# tenga cada maquina local.
#
# NINGUN secreto real vive aqui. El secreto de sesion se GENERA en cada corrida (paso
# "Credenciales efimeras"): solo sirve para la base de servicio, que se tira al acabar el job.
# No hay `.env` en CI; `init.sh` (6.b) ve `DATABASE_URL` en el entorno y no busca el archivo.
name: gate

# Plan GRATUITO de GitHub (2000 min/mes en repos privados; agotados, no corre nada): cada
# minuto cuenta. Por eso: nada en borradores, nada si el PR solo toca estado (`progress/`) o
# specs, cancelacion de corridas viejas y timeouts ajustados. Y sin branch protection en
# este plan: el check es INFORMATIVO; la convencion es mergear solo con el check en verde.
on:
  pull_request:
    branches: [dev, prod]
    types: [opened, synchronize, reopened, ready_for_review]
    # Solo se salta lo que ningun test lee: el estado (`progress/`) y los specs. Los `.md` del arnes
    # y del perfil NO: varias guardias leen docs y agentes, y un PR solo de texto puede romperlas
    # (paso con el #155, que se mergeo sin CI).
    paths-ignore:
      - 'progress/**'
      - 'specs/**'
  workflow_dispatch:

permissions:
  contents: read

# Un push nuevo al mismo PR cancela la corrida anterior: su veredicto ya no describe la punta.
concurrency:
  group: gate-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # La base de servicio del job (efimera: nace y muere con el). Los shards de vitest y el E2E la
  # migran (`prisma migrate deploy`) y le siembran los catalogos del sistema (`pnpm run db:seed`)
  # antes de correr; usuarios, zonas y ordenes los crea cada test (SL-31, R16/R17).
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/servi_logistic
  DIRECT_URL: postgresql://postgres:postgres@localhost:5432/servi_logistic
  NO_COLOR: '1'
  # `tsc --noEmit` ya pide ~2.1 GB sobre `dev` (medido el 2026-10-07) y ~2.5 GB con un PR
  # mediano encima; en el runner de 2 vCPU el heap por defecto de Node se queda corto y el
  # typecheck muere con "JavaScript heap out of memory" (PRs #160 y #162). Con SL-36 (PR #13)
  # 4 GB tampoco basta: `estatico` murio en el run 40188265664 (en local, tsc mide ~5,2 GB). El
  # runner de repo publico tiene 16 GB (ver el paso del build, que ya usa 8 GB) y esto es solo
  # un techo: no reserva memoria.
  NODE_OPTIONS: --max-old-space-size=8192

jobs:
  # LA SUITE VA EN SHARDS (docs/gate.md > En CI la suite va en shards). Tres jobs para un solo
  # check: `estatico` (typecheck, lint, validadores), `vitest` (la suite partida en 3 shards en
  # paralelo, SIN veredicto) y `gate-completo`, que une los informes y da el veredicto UNA vez.
  # El check que manda sigue llamandose `gate-completo`, y exige que los otros dos hayan corrido.
  #
  # El 3 vive en DOS sitios y tienen que coincidir: la matriz de `vitest` (`shard: [1, 2, 3]` y el
  # `/3` de GATE_SHARD) y el `--unir informes 3` de `gate-completo`. Si no coinciden, `--unir` da
  # rojo (exige exactamente N informes), asi que un desajuste no puede pasar en verde.
  estatico:
    name: estatico
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Sin Postgres: typecheck, lint y validadores no tocan la base. El `db:test status` de
    # `scripts/gate-proyecto.sh` avisa de que no puede consultarla y SIGUE (avisa, no falla).

    steps:
      - name: Checkout (historia completa)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Asegurar dev y origin/dev
        shell: bash
        run: |
          git fetch --no-tags origin +refs/heads/dev:refs/remotes/origin/dev
          git branch --force dev origin/dev

      - name: pnpm
        uses: pnpm/action-setup@v4
        # Sin `version`: la toma de `packageManager` en package.json (pnpm@10.10.0).

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Dependencias
        shell: bash
        run: pnpm install --frozen-lockfile

      - name: GATE_PARTE=estatico ./init.sh --completo
        shell: bash
        run: |
          # `bash` explicito: no depende del bit de ejecucion (los clones de Windows lo pierden).
          # `pipefail` para que el `tee` no se trague el codigo de salida del gate.
          set -o pipefail
          GATE_PARTE=estatico bash ./init.sh --completo 2>&1 | tee init-estatico.log

  vitest:
    name: vitest (shard ${{ matrix.shard }}/3)
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      # Sin fail-fast: un shard que cae no cancela a los otros. `gate-completo` necesita TODOS los
      # informes para dar veredicto, y un shard cancelado a medias es un rojo sin explicacion.
      fail-fast: false
      matrix:
        shard: [1, 2, 3]

    services:
      postgres:
        image: postgres:17
        env:
          # Superusuario: `prisma migrate deploy` crea extensiones y esquemas en la base de servicio.
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: servi_logistic
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Checkout (historia completa)
        uses: actions/checkout@v4
        with:
          # Historia entera y todas las ramas remotas: varias guardias calculan el merge-base
          # con `dev`/`origin/dev` (tests/guards/guard-qc102-*, guard-pantalla-pedidos-*).
          fetch-depth: 0

      - name: Asegurar dev y origin/dev
        shell: bash
        # Algunas guardias de alcance comparan contra `dev` LOCAL (`git diff dev...HEAD`), no solo
        # contra `origin/dev`: en CI no existe esa rama hasta que se crea aqui.
        run: |
          git fetch --no-tags origin +refs/heads/dev:refs/remotes/origin/dev
          git branch --force dev origin/dev

      - name: pnpm
        uses: pnpm/action-setup@v4
        # Sin `version`: la toma de `packageManager` en package.json (pnpm@10.10.0).

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Dependencias
        shell: bash
        run: pnpm install --frozen-lockfile

      - name: Credenciales efimeras (solo para la base de servicio de este job)
        shell: bash
        run: |
          # Cada valor se enmascara (por stdout, que es donde el runner lee los comandos) ANTES de
          # escribirlo en $GITHUB_ENV: asi no aparece en el log del job.
          gen() { node -e "process.stdout.write(require('node:crypto').randomBytes(18).toString('base64url'))"; }
          S1=$(gen)$(gen)
          echo "::add-mask::$S1"
          echo "SESSION_SECRET=$S1" >> "$GITHUB_ENV"

      # SL-31 (R16): sin esto la base de servicio esta vacia, sin tablas, y todo test de base cae.
      # `set -e`: si migrar o sembrar falla, el shard sale en rojo ANTES de correr la suite.
      # `db:seed` solo siembra catalogos del sistema (scripts/seed-catalogos.ts), nunca usuarios,
      # zonas ni ordenes; usa `@prisma/client`, por eso va despues de `generate`.
      - name: Base del shard (migrada + catalogos)
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec prisma generate
          pnpm exec prisma migrate deploy
          pnpm run db:seed

      - name: GATE_SHARD=${{ matrix.shard }}/3 ./init.sh --completo
        shell: bash
        run: |
          # `bash` explicito: no depende del bit de ejecucion (los clones de Windows lo pierden).
          # `pipefail` para que el `tee` no se trague el codigo de salida del gate.
          # Sale en verde aunque haya rojos: un shard NO da veredicto. Lo da `gate-completo`.
          # El log va FUERA del checkout: dentro, `git ls-files --others` lo ve mientras la suite corre
          # y las guardias que barren el arbol leen en el los nombres de otros tests (PR #1:
          # `sin-nombre-heredado` cayo por `init-shard.log:2653`).
          set -o pipefail
          GATE_SHARD=${{ matrix.shard }}/3 bash ./init.sh --completo 2>&1 | tee "$RUNNER_TEMP/init-shard.log"

      - name: Log del shard al workspace (solo para subirlo)
        if: always()
        shell: bash
        run: cp "$RUNNER_TEMP/init-shard.log" init-shard.log || echo "sin init-shard.log"

      - name: Informe del shard
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: informe-shard-${{ matrix.shard }}
          # `include-hidden-files`: desde upload-artifact v4.4 los archivos que empiezan por `.`
          # se excluyen POR DEFECTO, y `.vitest-rojos.json` y `.vitest-codigo` lo son. Sin esto el
          # artefacto saldria sin informe y `gate-completo` daria rojo siempre.
          include-hidden-files: true
          path: |
            .vitest-rojos.json
            .vitest-codigo
            init-shard.log
          if-no-files-found: warn
          retention-days: 14

  gate-completo:
    name: gate-completo
    needs: [estatico, vitest]
    # `always()`: tiene que correr AUNQUE un shard haya fallado, para decir por que. Sin el, un
    # job de shard caido dejaria `gate-completo` en «skipped», y un check saltado no es un rojo.
    if: always() && (github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # Clon superficial: `--unir` solo lee los informes, el baseline y los dos scripts del
      # veredicto; no mira la historia.
      - name: Checkout
        uses: actions/checkout@v4

      # Solo Node, sin pnpm ni `pnpm install`: `./init.sh --unir` es Node puro sobre JSON y corre
      # antes de cualquier paso que pida pnpm o node_modules. Una instalacion menos por corrida.
      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: El job estatico y los shards corrieron
        shell: bash
        env:
          ESTATICO: ${{ needs.estatico.result }}
          VITEST: ${{ needs.vitest.result }}
        # `vitest` en `failure` NO corta aqui: un shard puede haber dejado su informe igual, y lo
        # decide `--unir` (sin informe, rojo). Cancelado o saltado, en cambio, no dejo nada.
        run: |
          [ "$ESTATICO" = "success" ] || { echo "el job estatico (typecheck, lint, validadores) salio '$ESTATICO'"; exit 1; }
          case "$VITEST" in
            cancelled|skipped) echo "los shards de vitest salieron '$VITEST': no hay suite que juzgar"; exit 1 ;;
          esac

      - name: Informes de los shards
        uses: actions/download-artifact@v4
        with:
          # Cada artefacto en su carpeta, informes/informe-shard-<i>/ (sin `merge-multiple`).
          pattern: informe-shard-*
          path: informes/

      - name: ./init.sh --unir informes 3
        shell: bash
        run: |
          set -o pipefail
          bash ./init.sh --unir informes 3 2>&1 | tee init-completo.log

      - name: Resumen (poda del baseline de rojos)
        if: always()
        shell: bash
        run: |
          {
            echo "## gate-completo"
            echo
            echo '```'
            grep -E "baseline|rojos|init OK|✗" init-completo.log || echo "(sin lineas de baseline en el log)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Informe de vitest (unido)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-completo-informe
          # Mismo motivo que en los shards: sin esto `.vitest-rojos.json` no se sube.
          include-hidden-files: true
          path: |
            init-completo.log
            .vitest-rojos.json
          if-no-files-found: ignore
          retention-days: 14

  # EL E2E VA EN GRUPOS (SL-44 D6; R20-R25, R28). Dos jobs para un solo check, como la suite:
  # `e2e-grupo` corre un proyecto de Playwright por grupo, cada uno con su base propia y SIN
  # veredicto, y `e2e` mira el resultado de la matriz y da el veredicto UNA vez.
  #
  # Los grupos viven en DOS sitios y tienen que coincidir: la matriz de `e2e-grupo` y los
  # `projects` de playwright.config.ts (`aislamiento` arrastra `plataforma-vacia` por
  # `dependencies`). Un grupo que no exista en el config hace caer `playwright test --project=`.
  e2e-grupo:
    name: e2e (${{ matrix.grupo }})
    # Mismo disparo que `gate-completo`: cada PR a `dev` o a `prod` fuera de borrador, y a mano (R20).
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    # R28: cada grupo cabe en 30 min (install, build y Playwright incluidos).
    timeout-minutes: 30
    strategy:
      # Sin fail-fast: un grupo que cae no cancela a los otros; `e2e` los juzga a todos.
      fail-fast: false
      matrix:
        grupo: [aislamiento, reparto, dinero]

    # R21: cada grupo, su Postgres de servicio. Ningun grupo ve los datos de otro.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: servi_logistic
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: pnpm
        uses: pnpm/action-setup@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Dependencias
        shell: bash
        run: pnpm install --frozen-lockfile

      - name: Cliente de Prisma y tipos de ruta
        shell: bash
        run: |
          pnpm exec prisma generate
          pnpm exec next typegen

      # R23: generadas en cada corrida, nunca secretos del repositorio. `CRON_SECRET` lo leen la
      # app (rutas de cron) y los specs que las llaman; playwright.config.ts respeta el del entorno.
      - name: Credenciales efimeras (solo para la base de servicio de este grupo)
        shell: bash
        run: |
          # Cada valor se enmascara (por stdout, que es donde el runner lee los comandos) ANTES de
          # escribirlo en $GITHUB_ENV: asi no aparece en el log del job.
          gen() { node -e "process.stdout.write(require('node:crypto').randomBytes(18).toString('base64url'))"; }
          S1=$(gen)$(gen)
          echo "::add-mask::$S1"
          C1=$(gen)$(gen)
          echo "::add-mask::$C1"
          {
            echo "SESSION_SECRET=$S1"
            echo "CRON_SECRET=$C1"
            echo "APP_BASE_URL=http://localhost:3000"
            # SL-41 (R40): sin ella no hay enlace de bienvenida. Next la incrusta al compilar, asi
            # que tiene que estar antes de `next build`.
            echo "NEXT_PUBLIC_APP_URL=http://localhost:3000"
            # Fuera del checkout: lo sube el artefacto si el grupo cae (R25).
            echo "E2E_LOG_SERVIDOR=$RUNNER_TEMP/servidor-e2e.log"
          } >> "$GITHUB_ENV"

      # SL-31 (R17) y SL-44 (R21): la base se migra y se siembra SOLO con los catalogos del sistema.
      # La app nace vacia: cada spec crea su usuario y sus datos dentro de la prueba. `set -e`: si
      # migrar o sembrar falla, el grupo sale en rojo ANTES de correr Playwright.
      - name: Base del grupo (migrada + catalogos)
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec prisma migrate deploy
          pnpm run db:seed

      # `next build` y no `pnpm build`: el script de package.json migraria otra vez por su cuenta.
      # Playwright sirve este `.next` con `next start` (e2e/_servidor-app.mjs).
      # 4 GB no le bastan: en el run 40112266371 el grupo `dinero` murio por falta de memoria en el
      # build (los otros dos pasaron con el mismo codigo). El runner tiene 16 GB.
      - name: Build de la app
        shell: bash
        env:
          NODE_OPTIONS: --max-old-space-size=8192
        run: pnpm exec next build

      # Se cachean los binarios por version de Playwright; las dependencias del sistema se
      # instalan siempre.
      - name: Version de Playwright
        id: pw
        shell: bash
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache de navegadores
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}-chromium

      - name: Navegadores de Playwright
        if: steps.pw-cache.outputs.cache-hit != 'true'
        shell: bash
        run: pnpm exec playwright install --with-deps chromium

      - name: Dependencias de sistema de los navegadores
        if: steps.pw-cache.outputs.cache-hit == 'true'
        shell: bash
        run: pnpm exec playwright install-deps chromium

      # `CI=true` lo pone Actions: `forbidOnly`, un reintento y `failOnFlakyTests` (R24).
      - name: Playwright (${{ matrix.grupo }})
        shell: bash
        run: pnpm exec playwright test --project=${{ matrix.grupo }}

      # R25: trazas, informe y log del servidor. Todo es dato de prueba efimero (correos
      # `@example.test`, contrasenas y secretos generados en esta corrida).
      - name: Trazas del grupo
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-${{ matrix.grupo }}
          path: |
            test-results/
            playwright-report/
            ${{ runner.temp }}/servidor-e2e.log
          if-no-files-found: ignore
          retention-days: 14

  e2e:
    name: e2e
    needs: [e2e-grupo]
    # `always()`: tiene que correr AUNQUE un grupo haya fallado, para decir por que. Sin el, un
    # grupo caido dejaria `e2e` en «skipped», y un check saltado no es un rojo.
    if: always() && (github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # R22: verde solo si TODOS los grupos salieron `success`; rojo, cancelado o saltado, rojo.
      - name: Los grupos del E2E salieron en verde
        shell: bash
        env:
          GRUPOS: ${{ needs.e2e-grupo.result }}
        run: |
          [ "$GRUPOS" = "success" ] || { echo "los grupos del E2E (e2e-grupo) salieron '$GRUPOS': mira el job de cada grupo y su artefacto e2e-<grupo>"; exit 1; }
          echo "los grupos del E2E salieron 'success'"
